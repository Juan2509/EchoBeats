spring.application.name=echobeats-api
server.address=127.0.0.1
server.port=${ECHOBEATS_JAVA_PORT:8001}
server.error.include-message=never
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:echobeats}?connectTimeout=3
spring.datasource.username=${POSTGRES_USER:echobeats}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jdbc.template.query-timeout=3s
echobeats.media-root=${MEDIA_ROOT:data/media}
echobeats.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
echobeats.python-ready-url=${ECHOBEATS_PYTHON_READY_URL:}
