# Route by method and path so that reads and writes to the same resource can
# be handled by different services while sharing the existing API contract.
map "$request_method:$uri" $api_upstream {
    default backend:8000;

    ~^(GET|HEAD):/api/v1/(health|ready|tracks|albums|playlists|favorites|library/search)$ backend-java:8001;
    ~^(GET|HEAD):/api/v1/(tracks|albums|playlists)/[^/]+$ backend-java:8001;
    ~^(GET|HEAD):/api/v1/(tracks/[^/]+/audio|assets/[^/]+/content)$ backend-java:8001;
    ~^(GET|HEAD|PUT):/api/v1/(tracks/[^/]+/favorite|albums/[^/]+/wall)$ backend-java:8001;
    ~^POST:/api/v1/(playlists|albums/[^/]+/wall/reset)$ backend-java:8001;
    ~^PATCH:/api/v1/playlists/[^/]+$ backend-java:8001;
    ~^PUT:/api/v1/playlists/[^/]+/tracks$ backend-java:8001;
}

server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # FastAPI applies its configured limit on multipart uploads.
    client_max_body_size 0;

    location / {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}
